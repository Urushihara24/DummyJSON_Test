name: Security

on:
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit declared dependencies
        run: python -m pip_audit -r requirements.txt
